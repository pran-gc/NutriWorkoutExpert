# Deploy migrations + edge functions to the hosted Supabase project on push to
# main. Failed deploys fail visibly (the job goes red). (NWE-115 AC#2.)
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   — personal access token (Account → Access Tokens)
#   SUPABASE_PROJECT_REF    — the hosted project ref (Dashboard URL)
#   SUPABASE_DB_PASSWORD    — database password (for `db push`)
name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Deploy migrations + functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the hosted project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy api --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
